name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Minify CSS and JS
        run: |
          npx --yes csso-cli -i styles.css -o styles.css
          npx --yes terser script.js -o script.js --compress --mangle
          npx --yes terser js/theme.js -o js/theme.js --compress --mangle
          npx --yes terser js/analytics.js -o js/analytics.js --compress --mangle

      - name: Stamp cache-busting version on assets
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          sed -i -E "s/(styles\.css|script\.js|theme\.js|analytics\.js)(\?v=[a-zA-Z0-9_-]+)?/\1?v=${SHORT_SHA}/g" index.html 404.html qr/index.html

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
