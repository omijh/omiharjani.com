name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Minify CSS and JS
        run: |
          npx --yes csso-cli -i styles.css -o styles.css
          npx --yes terser script.js -o script.js --compress --mangle
          npx --yes terser js/theme.js -o js/theme.js --compress --mangle
          npx --yes terser js/analytics.js -o js/analytics.js --compress --mangle

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
